<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتایج جستجو - BSearch</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .results-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .results-header {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            z-index: 100;
        }
        
        .search-bar-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .search-bar-container .search-box-wrapper {
            flex: 1;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            max-width: 700px;
            margin: 1rem auto 0;
            padding: 0 2rem;
            overflow-x: auto;
        }
        
        .tab {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .tab:hover {
            background: var(--bg-hover);
        }
        
        .tab.active {
            background: var(--bg-hover);
            color: var(--primary-blue);
            font-weight: bold;
        }
        
        .main-content {
            flex: 1;
            padding: 1.5rem 2rem;
            max-width: 700px;
            width: 100%;
        }
        
        .search-result {
            margin-bottom: 2rem;
            padding: 1rem 0;
        }
        
        .result-url {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-decoration: none;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .result-url:hover {
            text-decoration: underline;
        }
        
        .result-title a {
            color: var(--primary-blue);
            font-size: 1.25rem;
            text-decoration: none;
            font-weight: normal;
        }
        
        .result-title a:hover {
            text-decoration: underline;
        }
        
        .result-snippet {
            color: var(--text-primary);
            line-height: 1.6;
            margin-top: 0.5rem;
        }
        
        .result-date {
            color: var(--text-secondary);
            font-size: 0.8125rem;
            display: block;
            margin-top: 0.5rem;
        }
        
        .pagination {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--primary-blue);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .page-btn:hover {
            box-shadow: var(--shadow);
        }
        
        .page-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }
        
        .rich-snippet {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
        }
        
        .faq-item {
            margin-bottom: 0.75rem;
        }
        
        .faq-item summary {
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-blue);
        }
        
        .loading-results {
            text-align: center;
            padding: 3rem;
        }
        
        @media (max-width: 768px) {
            .results-header, .main-content {
                padding: 1rem;
            }
            
            .tabs {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body class="light-mode results-page">
    <header class="results-header">
        <div class="search-bar-container">
            <a href="index.html" class="logo" style="font-size: 1.5rem; text-decoration: none;">
                <span class="b-blue">B</span><span class="g-red">S</span><span class="y-yellow">e</span><span class="b-blue">a</span><span class="g-green">r</span><span class="g-red">c</span><span class="y-yellow">h</span>
            </a>
            <form class="search-form" id="searchForm" style="flex: 1;">
                <div class="search-box-wrapper">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        name="q"
                        autocomplete="off"
                    >
                    <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1.5rem;">جستجو</button>
                </div>
            </form>
        </div>
        <nav class="tabs">
            <a href="#" class="tab active" data-type="web">همه</a>
            <a href="images.html" class="tab" data-type="image">تصاویر</a>
            <a href="videos.html" class="tab" data-type="video">ویدیوها</a>
            <a href="#" class="tab" data-type="news">اخبار</a>
            <a href="ai-search.html" class="tab" data-type="ai">پاسخ هوشمند</a>
        </nav>
    </header>

    <main class="main-content">
        <div id="results">
            <div class="loading-results">
                <div class="spinner"></div>
                <p>در حال بارگذاری نتایج...</p>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load search results from URL parameter
        document.addEventListener('DOMContentLoaded', () => {
            const query = Utils.getParam('q');
            if (query) {
                document.getElementById('searchInput').value = query;
                Search.performSearch(query);
            }
            
            // Setup tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    const type = tab.dataset.type;
                    if (type === 'web') {
                        window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                    } else if (type === 'ai') {
                        window.location.href = `ai-search.html?q=${encodeURIComponent(query)}`;
                    } else {
                        window.location.href = `${type}.html?q=${encodeURIComponent(query)}`;
                    }
                });
            });
        });
    </script>
</body>
</html>
