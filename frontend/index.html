<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="موتور جستجوی ایرانی BSearch - جستجو در وب فارسی">
    <meta name="theme-color" content="#4285f4">
    <title>BSearch - موتور جستجوی ایرانی</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
</head>
<body class="light-mode">
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-right">
                <a href="webmaster.html" class="nav-link">وبمستر</a>
                <a href="seo-tool.html" class="nav-link">ابزار سئو</a>
                <button id="themeToggle" class="theme-btn" aria-label="تغییر تم">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
            </div>
            <div class="nav-left">
                <a href="#" class="nav-link">Gmail</a>
                <button class="apps-btn" aria-label="برنامه‌ها">⋮⋮</button>
                <div class="profile-menu">
                    <button class="profile-btn" id="profileBtn">A</button>
                    <div class="dropdown" id="profileDropdown">
                        <a href="#" class="dropdown-item">ورود</a>
                        <a href="#" class="dropdown-item">تنظیمات</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="home-container">
        <div class="logo-section">
            <h1 class="logo">
                <span class="b-blue">B</span>
                <span class="g-red">S</span>
                <span class="y-yellow">e</span>
                <span class="b-blue">a</span>
                <span class="g-green">r</span>
                <span class="g-red">c</span>
                <span class="y-yellow">h</span>
            </h1>
            <p class="tagline">جستجوی هوشمند فارسی</p>
        </div>

        <div class="search-section">
            <form class="search-form" id="searchForm" action="search.html" method="GET">
                <div class="search-box-wrapper">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        name="q"
                        placeholder="جستجو کنید..."
                        autocomplete="off"
                        aria-label="جستجو"
                    >
                    <button type="button" class="voice-btn" id="voiceBtn" aria-label="جستجوی صوتی">
                        🎤
                    </button>
                    <button type="button" class="ai-search-btn" id="aiSearchBtn" aria-label="جستجوی هوش مصنوعی">
                        ✨
                    </button>
                </div>
                <div class="suggestions" id="suggestions"></div>
            </form>

            <div class="action-buttons">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('searchForm').submit()">
                    جستجوی گوگل
                </button>
                <button type="button" class="btn btn-secondary" id="luckyBtn">
                    شانس من
                </button>
            </div>

            <div class="language-options">
                <span>زبان:</span>
                <button class="lang-btn active" data-lang="fa">فارسی</button>
                <button class="lang-btn" data-lang="en">English</button>
                <button class="lang-btn" data-lang="ar">العربیة</button>
            </div>
        </div>

        <div class="quick-links">
            <a href="images.html" class="quick-link">
                <span class="icon">🖼️</span>
                <span>تصاویر</span>
            </a>
            <a href="videos.html" class="quick-link">
                <span class="icon">🎬</span>
                <span>ویدیوها</span>
            </a>
            <a href="ai-search.html" class="quick-link">
                <span class="icon">🤖</span>
                <span>پاسخ هوشمند</span>
            </a>
            <a href="#" class="quick-link">
                <span class="icon">📰</span>
                <span>اخبار</span>
            </a>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-location">ایران</div>
        <div class="footer-links">
            <div class="footer-row">
                <a href="#">درباره ما</a>
                <a href="#">تبلیغات</a>
                <a href="#">کسب‌وکار</a>
                <a href="#">حریم خصوصی</a>
            </div>
            <div class="footer-row">
                <a href="#">شرایط استفاده</a>
                <a href="#">تنظیمات جستجو</a>
                <a href="#">تماس با ما</a>
            </div>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
