<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جستجوی تصاویر - BSearch</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .images-page {
            min-height: 100vh;
            padding: 1rem;
        }
        
        .images-header {
            max-width: 1400px;
            margin: 0 auto 2rem;
        }
        
        .search-bar-large {
            max-width: 700px;
            margin-bottom: 1.5rem;
        }
        
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .image-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            aspect-ratio: 1;
            background: var(--bg-secondary);
        }
        
        .image-item:hover {
            transform: scale(1.02);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.75rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .image-item:hover .image-overlay {
            opacity: 1;
        }
        
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .image-modal.show {
            display: flex;
        }
        
        .modal-image {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
        }
        
        .modal-info {
            color: white;
            text-align: center;
            margin-top: 1rem;
        }
        
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
        
        .loading-images {
            text-align: center;
            padding: 3rem;
        }
        
        .infinite-scroll-trigger {
            height: 1px;
        }
        
        @media (max-width: 768px) {
            .images-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body class="light-mode images-page">
    <header class="images-header">
        <a href="index.html" class="logo" style="font-size: 1.5rem; text-decoration: none;">
            <span class="b-blue">B</span><span class="g-red">S</span><span class="y-yellow">e</span><span class="b-blue">a</span><span class="g-green">r</span><span class="g-red">c</span><span class="y-yellow">h</span>
        </a>
        <div class="search-bar-large search-section">
            <form class="search-form" id="searchForm">
                <div class="search-box-wrapper">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        name="q"
                        placeholder="جستجوی تصاویر..."
                        autocomplete="off"
                    >
                    <button type="submit" class="btn btn-primary">جستجو</button>
                </div>
            </form>
        </div>
    </header>

    <main>
        <div class="images-grid" id="imagesGrid">
            <div class="loading-images">
                <div class="spinner"></div>
                <p>در حال بارگذاری تصاویر...</p>
            </div>
        </div>
        <div class="infinite-scroll-trigger" id="scrollTrigger"></div>
    </main>

    <div class="image-modal" id="imageModal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <img class="modal-image" id="modalImage" src="" alt="">
        <div class="modal-info" id="modalInfo"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script>
        let currentPage = 1;
        let currentQuery = '';
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', () => {
            currentQuery = Utils.getParam('q') || '';
            if (currentQuery) {
                document.getElementById('searchInput').value = currentQuery;
                loadImages();
            }

            document.getElementById('searchForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const query = document.getElementById('searchInput').value.trim();
                if (query) {
                    window.location.href = `images.html?q=${encodeURIComponent(query)}`;
                }
            });

            Utils.onScrollToBottom(() => {
                if (!isLoading && currentQuery) {
                    currentPage++;
                    loadImages();
                }
            });
        });

        async function loadImages() {
            if (isLoading) return;
            isLoading = true;

            try {
                const data = await API.searchImages(currentQuery, {
                    page: currentPage,
                    limit: 20
                });

                renderImages(data.results || []);
            } catch (error) {
                console.error('Failed to load images:', error);
            } finally {
                isLoading = false;
            }
        }

        function renderImages(images) {
            const grid = document.getElementById('imagesGrid');
            
            // Remove loading message on first load
            if (currentPage === 1) {
                grid.innerHTML = '';
            }

            images.forEach(img => {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.innerHTML = `
                    <img src="${img.thumbnail}" alt="${img.title}" loading="lazy">
                    <div class="image-overlay">
                        <div>${img.title}</div>
                        <div>${img.source}</div>
                    </div>
                `;
                
                item.addEventListener('click', () => openModal(img));
                grid.appendChild(item);
            });
        }

        function openModal(image) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalInfo = document.getElementById('modalInfo');
            
            modalImg.src = image.url;
            modalInfo.innerHTML = `
                <h3>${image.title}</h3>
                <p>منبع: ${image.source}</p>
                <p>ابعاد: ${image.width} × ${image.height}</p>
            `;
            
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('show');
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
