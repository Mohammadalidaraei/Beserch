version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bsearch_postgres
    environment:
      POSTGRES_DB: bsearch
      POSTGRES_USER: bsearch
      POSTGRES_PASSWORD: bsearch_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bsearch_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bsearch_redis
    command: redis-server --requirepass bsearch_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bsearch_network
    restart: unless-stopped

  # OpenSearch (Elasticsearch Compatible)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bsearch_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - bsearch_network
    restart: unless-stopped

  # Backend (PHP 8.3 + Nginx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsearch_backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      - postgres
      - redis
      - opensearch
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bsearch
      - DB_USERNAME=bsearch
      - DB_PASSWORD=bsearch_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=bsearch_redis_password
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    networks:
      - bsearch_network
    restart: unless-stopped

  # AI Service (Python FastAPI)
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bsearch_ai
    volumes:
      - ./ai_service:/app
    ports:
      - "8001:8000"
    depends_on:
      - opensearch
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - MODEL_NAME=bert-base-multilingual-cased
    networks:
      - bsearch_network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsearch_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8001
    networks:
      - bsearch_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bsearch_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - ai_service
    networks:
      - bsearch_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  opensearch_data:

networks:
  bsearch_network:
    driver: bridge
