version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bsearch_postgres
    environment:
      POSTGRES_DB: bsearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bsearch_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bsearch_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bsearch_network
    restart: unless-stopped

  # OpenSearch (Search Engine)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bsearch_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - bsearch_network
    restart: unless-stopped

  # PHP Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsearch_backend
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage/logs:/var/www/html/storage/logs
    ports:
      - "8000:80"
    depends_on:
      - postgres
      - redis
      - opensearch
    environment:
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bsearch
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSEARCH_HOST: opensearch:9200
      AI_SERVICE_URL: http://ai_service:8001
    networks:
      - bsearch_network
    restart: unless-stopped

  # Python AI Service
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bsearch_ai_service
    volumes:
      - ./ai_service:/app
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bsearch
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_NAME: bert-base-multilingual-cased
    networks:
      - bsearch_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bsearch_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/var/www/frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - ai_service
    networks:
      - bsearch_network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsearch_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_API_URL: http://localhost:8001
    networks:
      - bsearch_network
    restart: unless-stopped

networks:
  bsearch_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
