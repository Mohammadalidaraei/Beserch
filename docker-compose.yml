version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bsearch-postgres
    environment:
      POSTGRES_DB: bsearch
      POSTGRES_USER: bsearch
      POSTGRES_PASSWORD: bsearch_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - bsearch-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bsearch-redis
    ports:
      - "6379:6379"
    networks:
      - bsearch-network
    restart: unless-stopped

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bsearch-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: admin_password
      plugins.security.disabled: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - bsearch-network
    restart: unless-stopped

  # PHP Backend
  php-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsearch-backend
    working_dir: /var/www/html
    volumes:
      - ./backend/public:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bsearch
      DB_USER: bsearch
      DB_PASS: bsearch_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - postgres
      - redis
      - opensearch
    ports:
      - "8000:80"
    networks:
      - bsearch-network
    restart: unless-stopped

  # Python AI Service
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bsearch-ai
    ports:
      - "8001:8001"
    networks:
      - bsearch-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bsearch-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/out:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php-backend
      - ai-service
    networks:
      - bsearch-network
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:

networks:
  bsearch-network:
    driver: bridge
