version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bsearch_postgres
    environment:
      POSTGRES_DB: bsearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bsearch_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bsearch_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bsearch_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenSearch Search Engine
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bsearch_opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      plugins.security.disabled: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - bsearch_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PHP Backend
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsearch_php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/logs:/var/www/html/logs
    ports:
      - "8000:80"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bsearch
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENSEARCH_HOST: opensearch:9200
      AI_SERVICE_URL: http://ai:8001
      JWT_SECRET: bsearch-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - bsearch_network

  # Python AI Service
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bsearch_ai
    volumes:
      - ./ai_service:/app
    ports:
      - "8001:8001"
    environment:
      MODEL_PATH: /app/models
      CACHE_DIR: /app/cache
    networks:
      - bsearch_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bsearch_nginx
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3000:80"
    depends_on:
      - php
      - ai
    networks:
      - bsearch_network

networks:
  bsearch_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
